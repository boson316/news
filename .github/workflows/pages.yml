# 每 15 分鐘抓一次 RSS，產生靜態網站並部署到 GitHub Pages
# 第一次使用前：Settings → Pages → Build and deployment → Source 選「GitHub Actions」
name: Update news & deploy Pages

on:
  schedule:
    - cron: "*/15 * * * *" # GitHub 排程可能延遲數分鐘，屬正常現象
  push:
    branches: [main]
  workflow_dispatch: # 可在 Actions 頁面手動執行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch RSS and build site
        env:
          # 讀取線上現有資料，累積歷史文章
          EXISTING_DATA_URL: ${{ steps.pages.outputs.base_url }}/data/articles.json
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
