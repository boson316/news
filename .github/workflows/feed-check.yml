# 檢測 RSS 來源是否可用：Actions → Check RSS feeds → Run workflow
name: Check RSS feeds

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/check_feeds.py
      - .github/workflows/feed-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_feeds.py
